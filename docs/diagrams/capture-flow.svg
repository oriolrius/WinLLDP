-size="13" textLength="303.723" font-family="Helvetica">(a Hyper-V physical NIC maps to its vEthernet)</text><rect x="295.698" y="322.883" width="344.499" height="50.266" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="305.698" y="344.95" fill="#000" font-size="13" textLength="227.094" font-family="Helvetica">Live session on those data sources</text><text x="305.698" y="360.083" fill="#000" font-size="13" textLength="324.499" font-family="Helvetica">filter EtherType 0x88CC, frames up to 9000 bytes</text><rect x="326.332" y="393.148" width="283.231" height="35.133" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="336.332" y="415.215" fill="#000" font-size="13" textLength="263.231" font-family="Helvetica">Write capture.pid (capture start returns)</text><rect x="331.737" y="492.281" width="272.421" height="50.266" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="341.737" y="514.348" fill="#000" font-size="13" textLength="158.869" font-family="Helvetica">Packet Monitor callback:</text><text x="341.737" y="529.481" fill="#000" font-size="13" textLength="252.421" font-family="Helvetica">copy the frame, look up its component</text><polygon points="352.776,562.547,583.119,562.547,595.119,574.547,583.119,586.547,352.776,586.547,340.776,574.547,352.776,562.547" fill="#FFF8E1" style="stroke:#E0C068;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352.776" y="579.047" fill="#000" font-size="13" textLength="230.344" font-family="Helvetica">component is a WinLLDP interface?</text><text x="321.767" y="571.953" fill="#3C4A5C" font-size="11" textLength="19.008" font-family="Helvetica">yes</text><text x="595.119" y="571.953" fill="#3C4A5C" font-size="11" textLength="13.702" font-family="Helvetica">no</text><rect x="193.095" y="596.547" width="181.776" height="35.133" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="203.095" y="618.614" fill="#000" font-size="13" textLength="161.776" font-family="Helvetica">Queue (interface, frame)</text><polygon points="171.224,651.68,396.743,651.68,408.743,666.813,396.743,681.945,171.224,681.945,159.224,666.813,171.224,651.68" fill="#FFF8E1" style="stroke:#E0C068;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="171.224" y="663.747" fill="#000" font-size="13" textLength="225.52" font-family="Helvetica">same frame on the same interface</text><text x="171.224" y="678.879" fill="#000" font-size="13" textLength="122.294" font-family="Helvetica">in the last second?</text><text x="145.522" y="664.218" fill="#3C4A5C" font-size="11" textLength="13.702" font-family="Helvetica">no</text><text x="408.743" y="664.218" fill="#3C4A5C" font-size="11" textLength="19.008" font-family="Helvetica">yes</text><rect x="56.323" y="691.945" width="185.801" height="35.133" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="66.323" y="714.012" fill="#000" font-size="13" textLength="165.801" font-family="Helvetica">Decode the LLDPDU TLVs</text><rect x="16" y="747.078" width="266.448" height="65.398" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="26" y="769.145" fill="#000" font-size="13" textLength="146.586" font-family="Helvetica">Update neighbors.json</text><text x="26" y="784.278" fill="#000" font-size="13" textLength="246.448" font-family="Helvetica">(key interface:source-MAC:chassis-ID,</text><text x="26" y="799.411" fill="#000" font-size="13" textLength="245.064" font-family="Helvetica">keeps first_seen, refreshes last_seen)</text><rect x="326.014" y="691.945" width="185.458" height="35.133" fill="#EAF2FB" style="stroke:#2F6DB5;stroke-width:0.5;" rx="5" ry="5"/><text x="336.014" y="714.012" fill="#000" font-size="13" textLength="165.458" font-family="Helvetica">Drop the duplicate report</text><polygon points="283.984,818.477,295.984,830.477,283.984,842.477,271.984,830.477,283.984,818.477" fill="#FFF8E1"