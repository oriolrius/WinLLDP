name: Release

# Releases are cut with commitizen: `uv run cz bump` updates the version and
# CHANGELOG.md, commits and tags vX.Y.Z; pushing the tag runs this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Check the tag matches pyproject.toml
        shell: bash
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Lint
        run: uv run ruff check .

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm pyinstaller.spec

      - name: Tests
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: uv run cz changelog "${GITHUB_REF_NAME#v}" --dry-run > release-notes.md

      - name: Name the executable after the version
        run: Move-Item dist\winlldp.exe "dist\winlldp-${{ github.ref_name }}.exe"

      - uses: softprops/action-gh-release@v3
        with:
          name: WinLLDP ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/winlldp-${{ github.ref_name }}.exe
