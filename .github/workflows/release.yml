name: Release

# Releases are cut with commitizen: `uvx --from commitizen cz bump` updates the
# version in Cargo.toml and CHANGELOG.md, commits and tags vX.Y.Z; pushing the tag
# runs this workflow. v1.x tags (Python, master) are built by the release.yml of
# the tagged commit, so both lines release independently.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: astral-sh/setup-uv@v7

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build executable
        run: cargo build --locked --release

      - name: Tests
        run: cargo test --locked --release

      - name: Tests that install/remove the XDP driver and the service (one at a time)
        run: cargo test --locked --release --test cli -- --ignored --test-threads=1

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: uvx --from commitizen cz changelog "${GITHUB_REF_NAME#v}" --dry-run > release-notes.md

      - name: Name the executable after the version
        run: Copy-Item target\release\winlldp.exe "winlldp-${{ github.ref_name }}.exe"

      - uses: softprops/action-gh-release@v3
        with:
          name: WinLLDP ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            winlldp-${{ github.ref_name }}.exe
            THIRD-PARTY-NOTICES.md
