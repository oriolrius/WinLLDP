name: Release

# Releases are cut with commitizen: `uvx --from commitizen cz bump` updates the
# version in Cargo.toml and CHANGELOG.md, commits and tags vX.Y.Z; pushing the tag
# runs this workflow, which publishes the executable, a ready-to-use zip and their
# SHA-256 sums. A tag runs the release.yml of its own commit, so the v1.x (Python,
# branch v1) and v2.x lines release independently.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: astral-sh/setup-uv@v7

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build executable
        run: cargo build --locked --release

      - name: Tests
        run: cargo test --locked --release

      - name: Tests that install/remove the XDP driver and the service (one at a time)
        run: cargo test --locked --release --test cli -- --ignored --test-threads=1

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: uvx --from commitizen cz changelog "${GITHUB_REF_NAME#v}" --dry-run > release-notes.md

      - name: Package the release
        shell: pwsh
        run: |
          $name = "winlldp-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force release, "release/$name" | Out-Null
          Copy-Item target/release/winlldp.exe "release/$name.exe"
          Copy-Item target/release/winlldp.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md, CHANGELOG.md "release/$name/"
          Copy-Item env.example "release/$name/env.example"
          Compress-Archive -Path "release/$name" -DestinationPath "release/$name.zip"
          Remove-Item -Recurse "release/$name"
          Copy-Item THIRD-PARTY-NOTICES.md release/
          $sums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: WinLLDP ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
