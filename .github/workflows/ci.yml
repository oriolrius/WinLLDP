name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build executable
        run: cargo build --locked --release

      - name: Smoke test
        run: .\target\release\winlldp.exe version

      - name: Tests (unit and executable integration tests)
        run: cargo test --locked --release

      - uses: actions/upload-artifact@v7
        with:
          name: winlldp-${{ github.sha }}
          path: target/release/winlldp.exe
          retention-days: 7
