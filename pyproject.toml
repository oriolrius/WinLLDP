[project]
name = "winlldp"
version = "1.0.0"
description = "LLDP service for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pywin32>=306",
    "psutil>=5.9.0",
    "tabulate>=0.9.0"
]

[project.scripts]
winlldp = "winlldp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# real errors only (ruff defaults); no style rules
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# PyInstaller entry point: imports the dependencies on purpose so they get bundled
"winlldp_main.py" = ["F401"]
